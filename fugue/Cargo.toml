[package]
name = "fugue"
version = "0.3.0"
authors = ["Sam Thomas <st@xv.ax>", "Zitai Chen <zitaichen@outlook.com>"]
edition = "2021"
license = "MIT"
description = "A binary analysis framework written in Rust"
homepage = "https://fugue.re"

[features]
core = ["fugue-core"]
default = ["static-lifters"]
static-lifters = ["fugue-core?/static-lifters", "fugue-lifter/default"]

[dependencies]
fugue-arch = { path = "../fugue-arch", version = "0.3" }
fugue-bv = { path = "../fugue-bv", version = "0.3" }
fugue-core = { path = "../fugue-core", version = "0.3", default-features = false, optional = true }
fugue-bytes = { path = "../fugue-bytes", version = "0.3" }
fugue-lifter = { path = "../fugue-lifter", version = "0.3", default-features = false }
fugue-sleigh = { path = "../fugue-sleigh", version = "0.3", features = ["language-parsers"] }
fugue-specs = { path = "../fugue-specs", version = "0.3" }
