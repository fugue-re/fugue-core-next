[package]
name = "fugue-core-idalib"
version = "0.3.0"
authors = ["Sam Thomas <st@xv.ax>"]
edition = "2021"

[dependencies]
fallible-iterator = "0.3"
fugue-core = { version = "0.3", path = "../fugue-core" }
idalib = { version = "0.6", git = "ssh://git@github.com/binarly-io/idalib.git", branch = "next" }
thiserror = "2"
tracing = "0.1"

[build-dependencies]
idalib-build = { version = "0.6", git = "ssh://git@github.com/binarly-io/idalib.git", branch = "next" }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
