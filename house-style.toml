entry_points = []

[vocabulary]
acronyms = ["ecode", "mcode", "pcode"]

[[vocabulary.term]]
reject = "argument"
prefer = "arg"
roles = ["field", "function", "local", "method", "module", "type"]
modules = ["crate::il"]
reason = "IL identifiers use Arg and Args consistently"

[[vocabulary.term]]
reject = "definition"
prefer = "def"
roles = ["type"]
modules = ["crate::il"]
reason = "IL type names abbreviate definition to Def"

[[vocabulary.term]]
reject = "identifier"
prefer = "id"
roles = ["type"]
modules = ["crate::il"]
reason = "IL type names abbreviate identifier to Id"

[[vocabulary.term]]
reject = "operation"
prefer = "op"
roles = ["type", "variant"]
modules = ["crate::il"]
reason = "IL type names abbreviate operation to Op"

[[vocabulary.term]]
reject = "operation"
prefer = "op"
roles = ["function", "method"]
modules = ["crate::il"]
reason = "IL function and method names pair op with type-level Op, matching Arg and arg"

[[vocabulary.term]]
reject = "ssa"
prefer = "omit the redundant SSA marker"
roles = ["module", "type"]
modules = ["crate::il::mcode"]
reason = "SSA is an invariant of the only MCode form, not a namespace or type discriminator"

[verbs]
additional = [
    "canonicalise",
    "compact",
    "convert",
    "evaluate",
    "fold",
    "optimise",
    "produce",
    "recover",
    "rewrite",
    "solve",
    "transform",
    "verify",
]

[[family]]
name = "ecode-mcode-builders"
modules = ["crate::il::ecode::builder", "crate::il::mcode::builder"]

[[family]]
name = "ecode-mcode-def-use"
modules = ["crate::il::ecode::def_use", "crate::il::mcode::def_use"]

[[family]]
name = "ecode-mcode-formatting"
modules = ["crate::il::ecode::format", "crate::il::mcode::format"]

[[family]]
name = "ecode-mcode-ir"
modules = ["crate::il::ecode::ir", "crate::il::mcode::ir"]

[[family]]
name = "ecode-mcode-memory"
modules = ["crate::il::ecode::memory", "crate::il::mcode::memory"]

[[family]]
name = "ecode-mcode-opcodes"
modules = ["crate::il::ecode::opcode", "crate::il::mcode::opcode"]

[[family]]
name = "ecode-mcode-operations"
modules = ["crate::il::ecode::operation", "crate::il::mcode::operation"]

[[family]]
name = "ecode-mcode-compaction"
modules = ["crate::il::ecode::optimise::compact", "crate::il::mcode::optimise::compact"]

[[family]]
name = "ecode-mcode-constant-folding"
modules = ["crate::il::ecode::optimise::fold", "crate::il::mcode::optimise::fold"]

[[family]]
name = "ecode-mcode-required-defs"
modules = ["crate::il::ecode::optimise::required", "crate::il::mcode::optimise::required"]

[[family]]
name = "ecode-mcode-values"
modules = ["crate::il::ecode::value", "crate::il::mcode::value"]

[[family]]
name = "ir-entity-tables"
modules = [
    "crate::ir::block::table",
    "crate::ir::function::table",
    "crate::ir::problem::table",
    "crate::ir::switch::table",
    "crate::ir::symbol::table",
]

[[family]]
name = "ecode-mcode-verification"
modules = ["crate::il::ecode::verify", "crate::il::mcode::verify"]

[[exception]]
rule = "rejected_term"
path = "fugue-core/src/il/mod.rs"
item = "crate::il::common"
reason = "common is the established representation-neutral IL infrastructure module"

[[exception]]
rule = "accessor_family"
path = "fugue-core/src/il/mcode/recovery/mod.rs"
item = "MCodeRecoveryConfig::with_alias_overrides"
reason = "the consuming composition operation rebinds the configuration's borrowed-fact lifetime and is not a field accessor"

[[exception]]
rule = "duplicate_helper"
path = "fugue-core/src/il/ecode/transform/ssa.rs"
item = "PCodeToECodeSsaLifter::lift_block_tree"
reason = "dialect-owned lifting policy consumes the shared IlDominanceEvents traversal without adding a callback protocol solely to merge two orchestration loops"

[[exception]]
rule = "duplicate_helper"
path = "fugue-core/src/il/mcode/transform/lifter.rs"
item = "ECodeToMCodeLifter::lift_block_tree"
reason = "dialect-owned lifting policy consumes the shared IlDominanceEvents traversal without adding a callback protocol solely to merge two orchestration loops"

[[vocabulary.term]]
reject = "converter"
prefer = "transformer"
roles = ["type"]
modules = ["crate::il"]
reason = "transform is the established IL vocabulary"

[[vocabulary.term]]
reject = "convert"
prefer = "transform"
roles = ["function", "method"]
modules = ["crate::il"]
reason = "transform is the established IL vocabulary"

[[vocabulary.term]]
reject = "converted"
prefer = "transformed"
roles = ["function", "method"]
modules = ["crate::il"]
reason = "transform is the established IL vocabulary"

[[exception]]
rule = "collection_custody"
item = "IlGraph::blocks"
reason = "IlGraph is the deliberate common owner of graph mechanics; its invariants bind blocks, successors and block sources together, and range checking already lives on IlIndexMapper"

[[exception]]
rule = "collection_custody"
item = "IlGraph::block_sources"
reason = "IlGraph is the deliberate common owner of graph mechanics; its invariants bind blocks, successors and block sources together, and range checking already lives on IlIndexMapper"

[[exception]]
rule = "collection_custody"
item = "IlGraphBuilder::blocks"
reason = "builder internals of the deliberate graph owner"

[[exception]]
rule = "collection_custody"
item = "ECodeIr::memory_domains"
reason = "read surface of a persisted dialect record; no separable contract"

[[exception]]
rule = "collection_custody"
item = "MCodeIr::values"
reason = "read surface of a persisted dialect record; no separable contract"

[[exception]]
rule = "collection_custody"
item = "MCodeIr::memory_domains"
reason = "read surface of a persisted dialect record; no separable contract"

[[exception]]
rule = "collection_custody"
item = "PCodeIr::source_spans"
reason = "read surface of a persisted dialect record; no separable contract"

[[exception]]
rule = "collection_custody"
item = "IlRegistry::forms"
reason = "form lookup surface of the registry owner"

[[exception]]
rule = "collection_custody"
item = "IlStaging::records"
reason = "staging lifecycle methods form the owner's contract; the stored cache is the only sibling state"

[[exception]]
rule = "allocating_getter"
item = "IlFormId::dialect"
reason = "component access on the form identifier; the derived id is small and the accessor form is the established call-site idiom"

[[exception]]
rule = "allocating_getter"
path = "fugue-core/src/il/pcode/transform.rs"
item = "metadata"
reason = "assembles the conversion's metadata record at one natural point; not a repeated accessor"

[[exception]]
rule = "associated_namespace_helper"
item = "IlFormId::component_count"
reason = "the IlFormId:: spelling is the point; the constant-like query reads as form-id vocabulary"

[[exception]]
rule = "large_inherent_impl"
item = "ECodeToMCodeLifter"
reason = "cohesive one-function transformation owner; splitting it was reviewed and rejected"

[[exception]]
rule = "parameter_clump"
path = "fugue-core/src/il/ecode/verify/mod.rs"
reason = "the verify constructors mirror each other across dialects; the three-parameter shape is the mirrored surface"

[[exception]]
rule = "repeated_mechanics"
path = "fugue-core/src/il/mcode"
reason = "MCode is scheduled to change; leave its mechanics alone until the new form lands"

[[exception]]
rule = "repeated_mechanics"
item = "define"
reason = "one side lives in MCode, which is scheduled to change; leave its mechanics alone until the new form lands"

[[exception]]
rule = "family_visibility_drift"
path = "fugue-core/src/il/ecode/optimise/required.rs"
reason = "ECode's required defs arrive through the analysis trait while MCode's take recovery inputs directly; the constructors are not corresponding operations"

[[exception]]
rule = "index_conversion_churn"
item = "evaluate"
reason = "the scalar evaluator bridges bit-width, shift-amount and byte-count domains at the BitVec boundary; each conversion is the boundary"

[[exception]]
rule = "family_visibility_drift"
path = "fugue-core/src/il/mcode/optimise/required.rs"
item = "MCodeRequiredDefs::new"
reason = "justified asymmetry: ECode reaches required defs through the analyse trait while MCode constructs its defs directly"

[[exception]]
rule = "repeated_mechanics"
path = "fugue-core/src/ir/symbol/table/transient.rs"
reason = "get_by_id and get_by_id_mut are API-symmetry twins; the mutable form mirrors the immutable body deliberately"

[[exception]]
rule = "repeated_mechanics"
path = "fugue-core/src/ir/symbol/table/persistent.rs"
reason = "ids_by_address and ids_by_name are parallel per-index scans; the shared shape is the index walk"

[[exception]]
rule = "family_visibility_drift"
path = "fugue-core/src/ir/function/table/mod.rs"
item = "publish_prepared"
reason = "publish visibility follows the caller: function materialises internally while the transaction layer drives the other tables"

[[exception]]
rule = "family_visibility_drift"
path = "fugue-core/src/ir/function/table/mod.rs"
item = "publish_upsert"
reason = "publish visibility follows the caller: function materialises internally while the transaction layer drives the other tables"

[[exception]]
rule = "family_visibility_drift"
path = "fugue-core/src/ir/function/table/mod.rs"
item = "publish_remove"
reason = "publish visibility follows the caller: function materialises internally while the transaction layer drives the other tables"

[[exception]]
rule = "family_visibility_drift"
path = "fugue-core/src/ir/symbol/table/mod.rs"
item = "publish_prepared"
reason = "publish visibility follows the caller: the prepared half-tie mirrors function's internal materialisation"
