entry_points = []

[accessors]
names = [
    "address_range",
    "coverage",
    "coverage_into",
    "call_target",
    "entry_address",
    "last_address",
    "next_address",
    "range",
    "size",
    "table",
]
prefixes = ["get"]
suffixes = ["at", "page"]

[parameters]
first = ["AnalysisContext"]

[vocabulary]
acronyms = ["ecode", "mcode", "pcode"]

[[vocabulary.term]]
reject = "tests"
prefer = "test"
roles = ["module"]
modules = ["crate"]
reason = "Rust test modules use the repository-wide singular `test` name"

[[vocabulary.term]]
reject = "data"
prefer = "place engine-owned invocation resources in crate::engine"
roles = ["module"]
modules = ["crate::analysis"]
reason = "analysis data is engine invocation infrastructure, not an analysis implementation"

[[vocabulary.term]]
reject = "parts"
prefer = "use the public AnalysisContext resource fields directly"
roles = ["type"]
modules = ["crate::engine"]
reason = "AnalysisContext must not gain a split-borrow wrapper"

[[vocabulary.term]]
reject = "argument"
prefer = "arg"
roles = ["field", "function", "local", "method", "module", "type"]
modules = ["crate::analysis::switch::interval", "crate::arch", "crate::il"]
reason = "IL-facing identifiers use Arg and Args consistently"

[[vocabulary.term]]
reject = "definition"
prefer = "def"
roles = ["type"]
modules = ["crate::il"]
reason = "IL type names abbreviate definition to Def"

[[vocabulary.term]]
reject = "identifier"
prefer = "id"
roles = ["type"]
modules = ["crate::il"]
reason = "IL type names abbreviate identifier to Id"

[[vocabulary.term]]
reject = "operation"
prefer = "op"
roles = ["type", "variant"]
modules = ["crate::il"]
reason = "IL type names abbreviate operation to Op"

[[vocabulary.term]]
reject = "operation"
prefer = "op"
roles = ["function", "method"]
modules = ["crate::arch", "crate::il", "crate::lifter"]
reason = "IL-facing function and method names pair op with type-level Op, matching Arg and arg"

[[vocabulary.term]]
reject = "operation"
prefer = "op"
roles = ["field", "local"]
modules = ["crate::arch"]
reason = "architecture intrinsic hooks use P-code user-op identifiers"

[[vocabulary.term]]
reject = "finalise"
prefer = "finish"
roles = ["field", "function", "local", "method", "module", "type", "variant"]
modules = ["crate"]
reason = "project-owned completion identifiers use finish consistently"

[[vocabulary.term]]
reject = "finalize"
prefer = "finish"
roles = ["field", "function", "local", "method", "module", "type", "variant"]
modules = ["crate"]
reason = "project-owned completion identifiers use finish consistently"

[[vocabulary.term]]
reject = "wave"
prefer = "describe the concrete recovery state"
roles = ["field", "function", "local", "method", "module", "type", "variant"]
modules = ["crate::analysis::function::recovery"]
reason = "function recovery has no wave lifecycle"

[[vocabulary.term]]
reject = "chunk"
prefer = "invocation, batch, or the concrete representation term"
roles = ["field", "function", "local", "method", "module", "type", "variant"]
modules = ["crate::analysis::function::recovery"]
reason = "chunk is overloaded and does not identify function-recovery ownership"

[[vocabulary.term]]
reject = "queue"
prefer = "add"
roles = ["function", "method"]
modules = ["crate::analysis::function::recovery"]
reason = "candidate registration uses the established add_candidate vocabulary"

[[vocabulary.term]]
reject = "run"
prefer = "apply"
roles = ["function", "method"]
modules = ["crate::analysis::function::recovery"]
reason = "analysis hook execution uses apply vocabulary"

[[vocabulary.term]]
reject = "initialisation"
prefer = "pre_resolution"
roles = ["field", "function", "method", "type", "variant"]
modules = ["crate::analysis::function::recovery"]
reason = "the general function-builder hook runs before instruction resolution"

[[vocabulary.term]]
reject = "idle"
prefer = "name the concrete recovery state or transition"
roles = ["field", "function", "local", "method", "type", "variant"]
modules = ["crate::analysis::function::recovery"]
reason = "function recovery has no generic idle lifecycle state"

[[vocabulary.term]]
reject = "inputs"
prefer = "context or the concrete fact collection"
roles = ["field", "method", "type"]
modules = ["crate::analysis::function::recovery"]
reason = "retained function-recovery facts are context, not generic inputs"

[[vocabulary.term]]
reject = "ssa"
prefer = "omit the redundant SSA marker"
roles = ["module", "type"]
modules = ["crate::il::mcode"]
reason = "SSA is an invariant of the only MCode form, not a namespace or type discriminator"

[verbs]
additional = [
    "canonicalise",
    "compact",
    "configure",
    "convert",
    "evaluate",
    "fold",
    "optimise",
    "produce",
    "recover",
    "rewrite",
    "solve",
    "transform",
    "verify",
]

