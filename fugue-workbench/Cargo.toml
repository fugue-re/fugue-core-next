[package]
name = "fugue-workbench"
version = "0.3.0"
authors = ["Sam Thomas <st@xv.ax>"]
edition = "2024"

[[bin]]
name = "fugue-workbench"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arc-swap = "1"
axum = { version = "0.8", features = ["multipart", "ws"] }
clap = "4"
fugue-core = { version = "0.3", path = "../fugue-core", features = ["sqlite"] }
mime_guess = "2"
rust-embed = "8"
rustc-hash = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ts-rs = "10"

[lints]
workspace = true
