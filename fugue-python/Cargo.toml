[package]
name = "fugue-python"
version = "0.3.0"
authors = ["Sam Thomas <st@xv.ax>"]
edition = "2024"

[lib]
name = "fugue"
crate-type = ["cdylib"]

[dependencies]
fallible-iterator = "0.3"
fugue-core = { version = "0.3", path = "../fugue-core", features = ["static-lifters"] }
pyo3 = "0.29.0"
serde_json = "1"
thiserror = "2"

[build-dependencies]
pyo3-build-config = "0.29.0"

[lints]
workspace = true
