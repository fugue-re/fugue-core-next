[package]
name = "fugue-core"
version = "0.3.0"
authors = ["Sam Thomas <st@xv.ax>"]
edition = "2024"

[dependencies]
anyhow = "1"
arrayvec = "0.7"
bincode = { version = "2", features = ["serde"] }
bitflags = "2"
blake3 = "1.8"
bytes = "1"
clone_dyn = "0.30"
dashmap = "6.1"
digest = "0.10"
fallible-iterator = "0.3"
fugue-arch = { version = "0.3", path = "../fugue-arch" }
fugue-bv = { version = "0.3", path = "../fugue-bv" }
fugue-bytes = { version = "0.3", path = "../fugue-bytes" }
fugue-lifter = { version = "0.3", path = "../fugue-lifter", features = ["bincode"] }
fugue-specs = { version = "0.3", path = "../fugue-specs" }
gazebo = "0.8"
hex-display = "0.3"
indexmap = "2.9"
iset = "0.3"
itertools = "0.14"
libmdbx = "0.5"
md-5 = "0.10"
memmap2 = "0.9"
object = "0.35"
ouroboros = "0.18"
quick_cache = "0.6"
parking_lot = "0.12"
range-set-blaze = "0.3"
rocksdb = { version = "0.23", features = ["serde1", "snappy"] }
rustc-hash = "1.1"
sealed = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3.13"
sha1 = "0.10"
sha2 = "0.10"
skiplist = "0.6"
smallvec = "1.15"
static_init = "1"
thiserror = "2"
tinyset = "0.5"
tracing = "0.1"
typeid = "1"
uuid = { version = "1", features = ["serde", "v7"] }
ustr = { version = "1.1", features = ["serde"] }
walkdir = "2.5"
yaxpeax-arch = { version = "0.3", default-features = false }
yaxpeax-arm = "0.3"
yaxpeax-x86 = "2.0"
zip = { version = "4.2", default-features = false, features = ["zstd"] }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
