[package]
name = "fugue-specs"
version = "0.3.0"
authors = ["Sam Thomas <st@xv.ax>"]
edition = "2021"
license = "MIT"
description = "A binary analysis framework written in Rust"
homepage = "https://fugue.re"

[features]
rkyv = ["dep:rkyv"]
default = []

[dependencies]
bitflags = { version = "2", features = ["serde"] }
fugue-arch = { version = "0.3", path = "../fugue-arch" }
fugue-bytes = { version = "0.3", path = "../fugue-bytes" }
fugue-lifter = { version = "0.3", path = "../fugue-lifter" }
fugue-sleigh = { version = "0.3", path = "../fugue-sleigh" }
ordered-float = { version = "5", features = ["serde"] }
nom = "8"
regex = "1"
rkyv = { version = "0.8", optional = true }
serde = "1"
serde-yaml = { version = "0.0.12", package = "serde-saphyr" }
thiserror = "2"

[lints]
workspace = true
