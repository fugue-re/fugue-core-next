[package]
name = "fugue-lifter-runtime"
version = "0.3.0"
edition = "2021"

[features]
rkyv = ["dep:rkyv"]
serde = ["dep:serde"]
default = []

[dependencies]
arrayvec = "0.7"
rkyv = { version = "0.8", features = ["arrayvec-0_7"], optional = true }
itertools = "0.14"
phf = { version = "0.13", features = ["macros"] }
serde = { version = "1", features = ["derive"], optional = true }
thiserror = "2"

[lints]
workspace = true
