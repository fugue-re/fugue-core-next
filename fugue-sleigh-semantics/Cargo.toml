[package]
name = "fugue-sleigh-semantics"
version = "0.3.0"
authors = ["Sam Thomas <st@xv.ax>"]
edition = "2021"
license = "MIT"
description = "A binary analysis framework written in Rust"
homepage = "https://fugue.re"

[dependencies]
arrayvec = "0.7"
fugue-lifter = { path = "../fugue-lifter", version = "0.3", default-features = false }
itertools = "0.14"
once_cell = "1"
pest = "2.8"
pest_derive = "2.8"
smallvec = "1.15"
thiserror = "2"
ustr = "1"

[dev-dependencies]
fugue-lifter = { path = "../fugue-lifter", version = "0.3", features = ["x86-64"], default-features = false }

[lints]
workspace = true
